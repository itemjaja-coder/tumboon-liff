<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Merit-Making Form / 在线布施表单</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #FAF7F2;
    margin: 0;
    padding: 16px;
    color: #3A3A3A;
  }
  h1 {
    font-size: 18px;
    color: #8A6D3B;
    text-align: center;
    margin-bottom: 4px;
  }
  h1 .zh {
    display: block;
    font-size: 15px;
    font-weight: 600;
    margin-top: 2px;
  }
  p.sub {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-top: 0;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .item {
    background: #fff;
    border: 1px solid #EADFCB;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .item-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .item-header input[type="checkbox"] {
    width: 20px;
    height: 20px;
  }
  .item-header label {
    font-size: 15px;
    font-weight: 600;
  }
  .item-header label .zh {
    font-weight: 400;
    color: #666;
    font-size: 13px;
  }
  .amounts {
    display: none;
    margin-top: 10px;
    gap: 8px;
  }
  .item.active .amounts {
    display: flex;
  }
  .amounts .field {
    flex: 1;
  }
  .amounts .field span {
    font-size: 12px;
    color: #888;
  }
  .amounts input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #DDD;
    border-radius: 6px;
    font-size: 14px;
  }
  #submitBtn {
    width: 100%;
    padding: 14px;
    background: #B08D57;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 12px;
  }
  #submitBtn:disabled {
    background: #ccc;
  }
  #status {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    color: #666;
  }
</style>
</head>
<body>

<h1>🙏 Online Merit-Making<span class="zh">在线布施</span></h1>
<p class="sub">
  Select the item(s) you wish to donate and enter the amount (only fill in the currency you are transferring).<br>
  请选择您要布施的项目并填写金额（只需填写您要转账的币种）。
</p>

<div id="itemsContainer"></div>

<button id="submitBtn">Confirm / 确认提交</button>
<div id="status"></div>

<script>
  // *** Set the deployed Apps Script Web App URL below ***
  // *** 请在下方设置已部署的 Apps Script Web App 网址 ***
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzR_t1e-pC8BjPygFTp2as78PV58IkGXsPM0ACLSpA74TjeIx_BjgQRCH4hQUz_cg3u/exec';
  const LIFF_ID = '2010905551-6MneH9FK';

  // Each merit item has an English (en) and Chinese (zh) label.
  // 每个功德项目都有英文（en）和中文（zh）标签。
  const MERIT_ITEMS = [
    { en: 'Offering rice to Buddha image', zh: '供佛饭' },
    { en: 'Pha Pa robe offering', zh: '布施袈裟林（帕巴）' },
    { en: 'Monk robe (Tri-civara) offering', zh: '供养三衣（僧袍）' },
    { en: 'Medicine offering', zh: '供养药品' },
    { en: 'Lamp/light offering', zh: '供养光明灯' },
    { en: 'Merit dedication to the deceased', zh: '功德回向亡者' },
    { en: 'Other merit', zh: '其他功德' }
  ];

  // Build a combined "English / Chinese" label used both for display and
  // for the value sent to the backend (kept in sync with code1_en_zh.gs).
  // 构建用于显示、并发送给后端的“英文 / 中文”组合标签
  // （与 code1_en_zh.gs 中的命名保持一致）。
  function bilingualLabel(item) {
    return item.en + ' / ' + item.zh;
  }

  const container = document.getElementById('itemsContainer');

  MERIT_ITEMS.forEach(function (item, idx) {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML =
      '<div class="item-header">' +
        '<input type="checkbox" id="chk' + idx + '">' +
        '<label for="chk' + idx + '">' + item.en + '<span class="zh"> / ' + item.zh + '</span></label>' +
      '</div>' +
      '<div class="amounts">' +
        '<div class="field"><span>THB / 泰铢</span><input type="number" min="0" id="thb' + idx + '" placeholder="0"></div>' +
        '<div class="field"><span>MYR / 令吉</span><input type="number" min="0" id="myr' + idx + '" placeholder="0"></div>' +
      '</div>';
    container.appendChild(div);

    div.querySelector('#chk' + idx).addEventListener('change', function (ev) {
      div.classList.toggle('active', ev.target.checked);
    });
  });

  document.getElementById('submitBtn').addEventListener('click', submitForm);

  function collectItems() {
    const items = [];
    MERIT_ITEMS.forEach(function (item, idx) {
      const checked = document.getElementById('chk' + idx).checked;
      if (!checked) return;
      const name = bilingualLabel(item);
      const thb = Number(document.getElementById('thb' + idx).value) || 0;
      const myr = Number(document.getElementById('myr' + idx).value) || 0;
      if (thb > 0) items.push({ name: name, amount: thb, currency: 'THB' });
      if (myr > 0) items.push({ name: name, amount: myr, currency: 'MYR' });
    });
    return items;
  }

  function submitForm() {
    const items = collectItems();
    if (items.length === 0) {
      document.getElementById('status').textContent =
        'Please select at least one item and enter an amount. / 请至少选择一项并填写金额。';
      return;
    }

    document.getElementById('submitBtn').disabled = true;
    document.getElementById('status').textContent = 'Saving... / 正在保存...';

    liff.getProfile().then(function (profile) {
  return fetch(WEBAPP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      source: 'liff',
      userId: profile.userId,
      displayName: profile.displayName,
      items: items
    })
  });
}).then(function () {
  document.getElementById('status').textContent = 'Saved. Closing window... / 保存成功，正在关闭窗口...';
  setTimeout(function () {
    liff.closeWindow();
  }, 1200);
}).catch(function (err) {
  document.getElementById('status').textContent =
    'Error / 出错了: ' + (err && err.message ? err.message : err);
  document.getElementById('submitBtn').disabled = false;
});
  }

  liff.init({ liffId: LIFF_ID }).catch(function (err) {
    document.getElementById('status').textContent = 'Unable to connect to LIFF / 无法连接 LIFF: ' + err;
  });
</script>

</body>
</html>
