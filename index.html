<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Merit-Making Form / 在线布施表单</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #FAF7F2;
    margin: 0;
    padding: 16px;
    color: #3A3A3A;
  }
  h1 {
    font-size: 18px;
    color: #8A6D3B;
    text-align: center;
    margin-bottom: 4px;
  }
  h1 .zh {
    display: block;
    font-size: 15px;
    font-weight: 600;
    margin-top: 2px;
  }
  p.sub {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-top: 0;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .item {
    background: #fff;
    border: 1px solid #EADFCB;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .item-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .item-header input[type="checkbox"] {
    width: 20px;
    height: 20px;
  }
  .item-header label {
    font-size: 15px;
    font-weight: 600;
  }
  .item-header label .th {
    display: block;
    font-weight: 400;
    color: #666;
    font-size: 13px;
    margin-top: 2px;
  }
  .amounts {
    display: none;
    margin-top: 10px;
    gap: 8px;
  }
  .item.active .amounts {
    display: flex;
  }
  .amounts .field {
    flex: 1;
  }
  .amounts .field span {
    font-size: 12px;
    color: #888;
  }
  .amounts input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #DDD;
    border-radius: 6px;
    font-size: 14px;
  }
  .note-field {
    display: none;
    margin-top: 8px;
  }
  .item.active .note-field {
    display: block;
  }
  .note-field span {
    font-size: 12px;
    color: #888;
    display: block;
    margin-bottom: 4px;
  }
  .note-field input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #DDD;
    border-radius: 6px;
    font-size: 14px;
  }
  #submitBtn {
    width: 100%;
    padding: 14px;
    background: #B08D57;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 12px;
  }
  #submitBtn:disabled {
    background: #ccc;
  }
  #status {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    color: #666;
  }
</style>
</head>
<body>

<h1>🙏 Online Merit-Making<span class="zh">在线布施</span></h1>
<p class="sub">
  Select the item(s) you wish to donate and enter the amount in MYR (Ringgit).<br>
  请选择您要布施的项目并填写令吉（MYR）金额。
</p>

<div id="itemsContainer"></div>

<button id="submitBtn">Confirm / 确认提交</button>
<div id="status"></div>

<script>
  // *** Set the deployed Apps Script Web App URL below ***
  // *** 请在下方设置已部署的 Apps Script Web App 网址 ***
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwP7dyZ-AtLvMkwpOec_tuij4s1JQ7_WVI2ER-8R1BcU5v9T_IgbAbGhvBMdKahEl8P/exec';
  const LIFF_ID = '2010905551-6MneH9FK';

  // Each merit item has a Chinese (zh), English (en), and Thai (th) label,
  // matching the printed donation form. zh is '' for items that only ever
  // appear in EN/TH on the printed form (e.g. PHAPA).
  //
  // ⚠️ The "en" value here is sent to the backend as each item's unique "key"
  // (used to match it to its own certificate template in final.gs). It must
  // exactly match the "en" value for the same item in final.gs's MERIT_ITEMS list.
  //
  // 每个功德项目都有中文（zh）、英文（en）、泰文（th）标签，与纸质表格保持一致。
  //
  // ⚠️ 这里的 "en" 值会作为该项目的唯一 "key" 发送给后端（用于在 final.gs 中
  // 匹配到该项目专属的证书模板）。必须与 final.gs 的 MERIT_ITEMS 列表中
  // 同一项目的 "en" 值完全一致。
  const MERIT_ITEMS = [
    { zh: '荟供法会', en: 'FIRST SUNDAY', th: 'บุญบูชาข้าวพระ' },
    { zh: '', en: 'PHAPA', th: 'บุญถวายผ้าป่า' },
    { zh: '袈裟', en: 'ROBE', th: 'บุญถวายผ้าไตรจีวร' },
    { zh: '药物', en: 'MEDICINE', th: 'บุญถวายยา' },
    { zh: '点灯', en: 'CANDLE', th: 'บุญถวายปทีป' },
    { zh: '回向', en: 'TRANSFER OF MERITS', th: 'บุญอุทิศส่วนกุศลแก่ผู้ล่วงลับ' },
    { zh: '迦絺那', en: 'KATHINA', th: 'บุญกฐิน' },
    { zh: '其他', en: 'OTHERS', th: 'บุญอื่นๆ' }
  ];

  // Build a combined "Chinese English / Thai" label used both for display and
  // for the value sent to the backend (kept in sync with final.gs).
  // 构建用于显示、并发送给后端的组合标签（与 final.gs 中的命名保持一致）。
  function trilingualLabel(item) {
    const zhEn = item.zh ? (item.zh + ' ' + item.en) : item.en;
    return zhEn + ' / ' + item.th;
  }

  const container = document.getElementById('itemsContainer');

  MERIT_ITEMS.forEach(function (item, idx) {
    const div = document.createElement('div');
    div.className = 'item';
    const zhEnLine = item.zh ? (item.zh + ' ' + item.en) : item.en;
    const isOthers = item.en === 'OTHERS';
    div.innerHTML =
      '<div class="item-header">' +
        '<input type="checkbox" id="chk' + idx + '">' +
        '<label for="chk' + idx + '">' + zhEnLine + '<span class="th">' + item.th + '</span></label>' +
      '</div>' +
      '<div class="amounts">' +
        '<div class="field"><span>MYR / 令吉 / ริงกิต</span><input type="number" min="0" id="myr' + idx + '" placeholder="0"></div>' +
      '</div>' +
      (isOthers
        ? '<div class="note-field"><span>Details / 详情 / รายละเอียด</span><input type="text" id="note' + idx + '" placeholder="Please specify / 请说明 / โปรดระบุ"></div>'
        : '');
    container.appendChild(div);

    div.querySelector('#chk' + idx).addEventListener('change', function (ev) {
      div.classList.toggle('active', ev.target.checked);
    });
  });

  document.getElementById('submitBtn').addEventListener('click', submitForm);

  // Builds ONE entry per ticked item (not per currency) — this is what makes
  // the backend generate exactly one certificate per ticked item. "key" is the
  // item's unique "en" tag (used to match its own certificate template), and
  // the "OTHERS" item also carries whatever free-text detail was typed.
  // Only MYR (Ringgit) is collected — Thai Baht donations are no longer accepted.
  // 每个被勾选的项目只生成一条记录（而不是每种货币一条）——这样后端才能
  // 为每个勾选项目各生成一张证书。"key" 是该项目唯一的 "en" 标识
  // （用于匹配其专属证书模板），"OTHERS"（其他）项目还会附带用户填写的详细说明文字。
  // 现在只收取令吉（MYR）—— 不再接受泰铢（THB）布施。
  function collectItems() {
    const items = [];
    MERIT_ITEMS.forEach(function (item, idx) {
      const checked = document.getElementById('chk' + idx).checked;
      if (!checked) return;
      const myr = Number(document.getElementById('myr' + idx).value) || 0;
      if (myr <= 0) return; // ticked but no amount entered — skip
      const noteEl = document.getElementById('note' + idx);
      const note = noteEl ? noteEl.value.trim() : '';
      items.push({ name: trilingualLabel(item), key: item.en, myr: myr, note: note });
    });
    return items;
  }

  function submitForm() {
    const items = collectItems();
    if (items.length === 0) {
      document.getElementById('status').textContent =
        'Please select at least one item and enter an amount. / 请至少选择一项并填写金额。';
      return;
    }

    document.getElementById('submitBtn').disabled = true;
    document.getElementById('status').textContent = 'Saving... / 正在保存...';

    liff.getProfile().then(function (profile) {
      return fetch(WEBAPP_URL, {
        method: 'POST',
        mode: 'no-cors',
        // Uses text/plain to avoid a CORS preflight (OPTIONS), which the
        // Apps Script Web App doesn't handle.
        // 使用 text/plain 以避免 CORS 预检请求（OPTIONS）——
        // Apps Script Web App 不支持处理该请求。
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          source: 'liff',
          userId: profile.userId,
          displayName: profile.displayName,
          items: items
        })
      });
    }).then(function () {
      document.getElementById('status').textContent = 'Saved. Closing window... / 保存成功，正在关闭窗口...';
      setTimeout(function () {
        liff.closeWindow();
      }, 1200);
    }).catch(function (err) {
      document.getElementById('status').textContent =
        'Error / 出错了: ' + (err && err.message ? err.message : err);
      document.getElementById('submitBtn').disabled = false;
    });
  }

  liff.init({ liffId: LIFF_ID }).catch(function (err) {
    document.getElementById('status').textContent = 'Unable to connect to LIFF / 无法连接 LIFF: ' + err;
  });
</script>

</body>
</html>
